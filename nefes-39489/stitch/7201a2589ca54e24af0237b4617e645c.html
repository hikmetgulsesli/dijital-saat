<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;700;800&amp;family=Inter:wght@300;400;600&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-bright": "#31394d",
                    "on-tertiary-fixed-variant": "#4f319c",
                    "tertiary": "#cebdff",
                    "on-error": "#690005",
                    "tertiary-fixed-dim": "#cebdff",
                    "inverse-surface": "#dae2fd",
                    "surface": "#0b1326",
                    "primary-container": "#8083ff",
                    "secondary": "#d0bcff",
                    "on-secondary-fixed-variant": "#5516be",
                    "error-container": "#93000a",
                    "surface-dim": "#0b1326",
                    "secondary-container": "#571bc1",
                    "tertiary-container": "#9b7fed",
                    "on-tertiary-container": "#31057e",
                    "on-tertiary-fixed": "#21005e",
                    "on-background": "#dae2fd",
                    "inverse-on-surface": "#283044",
                    "surface-container": "#171f33",
                    "on-surface-variant": "#c7c4d7",
                    "on-tertiary": "#381385",

                    "error": "#ffb4ab",

                    "surface-container-lowest": "#060e20",
                    "tertiary-fixed": "#e8ddff",

                    "on-primary-fixed": "#07006c",
                    "inverse-primary": "#494bd6",
                    "secondary-fixed-dim": "#d0bcff",
                    "on-primary": "#1000a9",
                    "outline": "#908fa0",
                    "background": "#0b1326",
                    "on-primary-container": "#0d0096",
                    "surface-container-highest": "#2d3449",
                    "outline-variant": "#464554",
                    "on-secondary-fixed": "#23005c",
                    "on-error-container": "#ffdad6",
                    "surface-tint": "#c0c1ff",
                    "primary-fixed": "#e1e0ff",
                    "surface-variant": "#2d3449",
                    "surface-container-high": "#222a3d",
                    "secondary-fixed": "#e9ddff",
                    "on-secondary": "#3c0091"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"

            "fontFamily": {
                    "headline": ["Manrope"],
                    "body": ["Inter"],
                    "label": ["Inter"]

        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .ethereal-glow {
            background: radial-gradient(circle at 50% 50%, rgba(192, 193, 255, 0.08) 0%, rgba(11, 19, 38, 0) 70%);
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body overflow-x-hidden">
<!-- Top Navigation Anchor (As requested by JSON for top-level ecosystem) -->
<header class="fixed top-0 w-full bg-[#0b1326]/80 backdrop-blur-xl z-50 flex justify-between items-center px-8 h-20 shadow-[0_10px_40px_-15px_rgba(192,193,255,0.08)]">
<div class="text-2xl font-bold tracking-widest text-indigo-200 font-headline uppercase">Nefes</div>
<div class="flex items-center gap-6">
<span class="material-symbols-outlined text-indigo-300" data-icon="settings">settings</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="min-h-screen pt-32 pb-20 px-6 flex flex-col items-center justify-center relative">
<!-- Atmospheric Background Element -->
<div class="absolute inset-0 ethereal-glow -z-10"></div>
<!-- Decorative Luminous Circle -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-primary/5 rounded-full blur-[100px] -z-10"></div>
<!-- Success Hero Section -->
<div class="text-center mb-16">
<div class="mb-8 inline-flex items-center justify-center w-24 h-24 rounded-full bg-surface-container-high relative">
<div class="absolute inset-0 rounded-full border border-primary/20 animate-pulse"></div>
<span class="material-symbols-outlined text-5xl text-primary" data-icon="auto_awesome" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
<h1 class="font-headline font-extrabold text-5xl md:text-7xl text-on-surface tracking-tight mb-4">Harika İş!</h1>
<p class="text-on-surface-variant text-lg md:text-xl font-light tracking-wide max-w-md mx-auto">Zihnini tazeledin ve kendine bir an ayırdın. Sessizliğin tadını çıkar.</p>
</div>
<!-- Summary Bento Cards -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-2xl mb-16">
<!-- Time Card -->
<div class="bg-surface-container-high rounded-3xl p-8 flex flex-col justify-between aspect-square md:aspect-auto">
<div class="flex justify-between items-start">
<span class="material-symbols-outlined text-indigo-300/40" data-icon="schedule">schedule</span>
<span class="text-primary-fixed-dim text-xs font-bold tracking-widest uppercase">Toplam Süre</span>
</div>
<div class="mt-8">
<div class="font-headline text-5xl font-bold text-on-surface">15:00</div>
<div class="text-on-surface-variant text-sm mt-2">Dakika Kesintisiz Odak</div>
</div>
</div>
<!-- Cycles Card -->
<div class="bg-surface-container-high rounded-3xl p-8 flex flex-col justify-between aspect-square md:aspect-auto">
<div class="flex justify-between items-start">
<span class="material-symbols-outlined text-indigo-300/40" data-icon="air">air</span>
<span class="text-primary-fixed-dim text-xs font-bold tracking-widest uppercase">Döngü Sayısı</span>
</div>
<div class="mt-8">
<div class="font-headline text-5xl font-bold text-on-surface">42</div>
<div class="text-on-surface-variant text-sm mt-2">Tamamlanan Nefes Döngüsü</div>
</div>
</div>
</div>
<!-- Action Section -->
<div class="flex flex-col gap-6 w-full max-w-md">
<button class="w-full h-16 rounded-full bg-gradient-to-r from-primary to-primary-container text-on-primary font-bold text-lg shadow-[0_20px_40px_-10px_rgba(128,131,255,0.3)] transition-all hover:scale-[1.02] active:scale-95 duration-300">
                Tekrar Başlat
            </button>
<button class="w-full h-16 rounded-full bg-surface-container-low text-on-surface font-semibold text-lg border border-outline-variant/15 transition-all hover:bg-surface-container-high duration-300">
                Ana Sayfaya Dön
            </button>
</div>
<!-- Session Image - Editorial Style -->
<div class="mt-24 w-full max-w-4xl overflow-hidden rounded-[2.5rem] relative aspect-[21/9]">
<img alt="Meditation focus" class="w-full h-full object-cover opacity-40 mix-blend-lighten" data-alt="Abstract ethereal background with soft purple and blue light leaks and subtle grainy texture representing tranquility and calm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCw2g73655d_Lo1wujXjhro49KFdnD8g-CXe_yGastXr0gCFbbcJUR5vzU0tHM7N-JFjrE5Rt6b9KF9ob91HOJgoYN6QiA3-730-ov7VUdmoQSYkm3pGoCESQ9TNuDVgmbV95istDdYNXPZJSJv_VGg9ln2e1fK6_UyNEMgR3c3-k1dLDqumimj04ZuxtYaKmQ0hceVvtRyrDJf-IKPAaeqDox1p4SZQDGijkJioS7TXeRScnsRSV9xBIvwFdp-088qgsWn504-OKw"/>
<div class="absolute inset-0 bg-gradient-to-t from-surface via-transparent to-transparent"></div>
<div class="absolute bottom-8 left-12">
<p class="font-headline text-indigo-200/60 italic text-xl">"Nefes, bedenin ruhla olan sessiz diyaloğudur."</p>
</div>
</div>
</main>
<!-- Side Navigation (Suppressed for focused Transactional/Success screen as per UX Goal) -->
<footer class="py-12 px-8 text-center border-t border-outline-variant/5">
<p class="text-on-surface-variant/40 text-xs tracking-widest font-label uppercase">Nefes Digital Ether © 2024</p>
</footer>
</body></html>
