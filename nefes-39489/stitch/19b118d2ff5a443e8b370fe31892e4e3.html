                    "on-background": "#dae2fd",

                    "on-secondary-fixed": "#23005c",
                    "on-error-container": "#ffdad6",

<style>
        @keyframes pulse-soft {
            0%, 100% { opacity: 0.4; transform: scale(1); filter: blur(4px); }
            50% { opacity: 0.8; transform: scale(1.05); filter: blur(8px); }
        }
        @keyframes drift {
            0% { transform: translate(0, 0); }
            50% { transform: translate(-2%, 2%); }
            100% { transform: translate(0, 0); }
        }
        .animate-pulse-soft {
            animation: pulse-soft 4s ease-in-out infinite;
        }
        .animate-drift {
            animation: drift 20s ease-in-out infinite;
        }
        .loading-progress {
            width: 0%;
            animation: progress-fill 5s ease-out forwards;
        }
        @keyframes progress-fill {
            0% { width: 0%; }
            20% { width: 30%; }
            45% { width: 35%; }
            70% { width: 85%; }
            100% { width: 92%; }
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body min-h-screen overflow-hidden flex flex-col items-center justify-center">
<!-- Ambient Background Texture -->
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute -top-1/4 -left-1/4 w-[150%] h-[150%] opacity-20 animate-drift bg-[radial-gradient(circle_at_50%_50%,#571bc1_0%,transparent_50%)]"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-full bg-[url('https://www.transparenttextures.com/patterns/asfalt-dark.png')] opacity-[0.03]"></div>
</div>
<!-- Main Content Canvas -->
<main class="relative z-10 flex flex-col items-center justify-center px-6 text-center max-w-lg w-full">
<!-- Logo Section -->
<div class="relative mb-24">
<!-- Glow Effect behind Logo -->
<div class="absolute inset-0 bg-primary blur-[60px] opacity-20 rounded-full animate-pulse-soft"></div>
<div class="relative flex flex-col items-center gap-4">
<span class="material-symbols-outlined text-7xl text-primary animate-pulse-soft" style="font-variation-settings: 'FILL' 0, 'wght' 100;">
                    air
                </span>
<h1 class="font-headline text-5xl font-extrabold tracking-[0.2em] text-indigo-200">
                    NEFES
                </h1>
</div>
</div>
<!-- Progress Indicator Section -->
<div class="w-full space-y-8 flex flex-col items-center">
<!-- Custom Circular Progress Concept -->
<div class="relative w-16 h-16 mb-4">
<div class="absolute inset-0 rounded-full border-2 border-primary/10"></div>
<div class="absolute inset-0 rounded-full border-2 border-t-primary border-r-transparent border-b-transparent border-l-transparent animate-spin duration-1000"></div>
</div>
<!-- Text Content -->
<div class="space-y-3">
<p class="font-headline text-xl font-light tracking-wide text-on-surface/90">
                    Zihninizi hazırlıyoruz...
                </p>
<p class="text-sm font-label text-on-surface-variant/60 tracking-widest">
                    LÜTFEN BEKLEYİNİZ
                </p>
</div>
<!-- Subtle Linear Loading Bar -->
<div class="w-48 h-[2px] bg-surface-container-highest rounded-full overflow-hidden mt-8">
<div class="loading-progress h-full bg-gradient-to-r from-secondary-container to-primary shadow-[0_0_15px_rgba(192,193,255,0.4)]"></div>
</div>
</div>
</main>
<!-- Footer Decorative Elements -->
<footer class="fixed bottom-12 z-10 opacity-30">
<p class="text-[10px] tracking-[0.4em] font-label text-indigo-300/50">
            DIGITAL ETHER SYSTEM v2.0
        </p>
</footer>
