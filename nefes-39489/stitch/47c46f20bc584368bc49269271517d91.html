<style>
        .glass-panel {
            background: rgba(45, 52, 73, 0.6);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
        }
        .ethereal-glow {
            box-shadow: 0 0 40px 0 rgba(192, 193, 255, 0.08);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
    </style>

<body class="bg-surface text-on-surface font-body min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
<!-- Background Decorative Glows -->
<div class="fixed top-[-10%] left-[-10%] w-[50%] h-[50%] bg-primary/10 blur-[120px] rounded-full pointer-events-none"></div>
<div class="fixed bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-secondary/5 blur-[120px] rounded-full pointer-events-none"></div>
<!-- Main Content Canvas (Behind Modal) -->
<div class="absolute inset-0 z-0 flex flex-col items-center justify-center opacity-20 select-none">
<h1 class="font-headline text-8xl font-extrabold tracking-tighter text-primary/20">Nefes</h1>
<p class="font-body text-xl text-on-surface-variant">Huzura Odaklanın</p>
</div>
<!-- Modal Overlay Backdrop -->
<div class="fixed inset-0 bg-surface-dim/80 backdrop-blur-sm z-40"></div>
<!-- Settings Modal Container -->
<main class="relative z-50 w-full max-w-2xl transform transition-all duration-300">
<div class="glass-panel ethereal-glow rounded-[2rem] overflow-hidden border border-outline-variant/10">
<!-- Modal Header -->
<header class="px-8 pt-10 pb-6 flex justify-between items-start">
<div>
<h2 class="font-headline text-3xl font-bold tracking-tight text-primary">Ayarlar</h2>
<p class="text-on-surface-variant font-light mt-1">Nefes-39489 Deneyimini Kişiselleştirin</p>
</div>
<button class="p-2 rounded-full hover:bg-white/5 transition-colors group">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">close</span>
</button>
</header>
<!-- Modal Content -->
<div class="px-8 pb-10 space-y-12">
<!-- Audio Section -->
<section class="space-y-6">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">volume_up</span>
<h3 class="font-headline text-lg font-semibold text-on-surface">Ses Deneyimi</h3>
</div>
<div class="bg-surface-container-high/40 p-6 rounded-2xl flex items-center justify-between transition-all hover:bg-surface-container-high/60">
<div class="space-y-1">
<span class="block font-medium text-on-surface">Ses Efektleri</span>
<span class="text-sm text-on-surface-variant">Nefes alma/verme sinyalleri için sesli uyarılar.</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-14 h-7 bg-surface-container-highest peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-0.5 after:start-[4px] after:bg-on-surface-variant peer-checked:after:bg-white after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-gradient-to-br peer-checked:from-primary peer-checked:to-primary-container"></div>
</label>
</div>
</section>
<!-- Exercise Preferences Section -->
<section class="space-y-6">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">shutter_speed</span>
<h3 class="font-headline text-lg font-semibold text-on-surface">Egzersiz Tercihleri</h3>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Technique Selection -->
<div class="space-y-3">
<label class="text-sm font-medium text-on-surface-variant px-1">Varsayılan Teknik</label>
<div class="flex flex-col gap-2">
<label class="group cursor-pointer">
<input checked="" class="hidden peer" name="technique" type="radio"/>
<div class="p-4 rounded-xl bg-surface-container-low border border-transparent peer-checked:border-primary/30 peer-checked:bg-primary/5 transition-all group-hover:bg-surface-container-high">
<div class="flex items-center justify-between">
<div>
<span class="block font-semibold text-on-surface">4-4-4</span>
<span class="text-xs text-on-surface-variant">Kutu Nefesi</span>
</div>
<div class="w-4 h-4 rounded-full border-2 border-outline-variant peer-checked:group-[]:border-primary peer-checked:group-[]:bg-primary flex items-center justify-center">
<div class="w-1.5 h-1.5 rounded-full bg-surface hidden peer-checked:group-[]:block"></div>
</div>
</div>
</div>
</label>
<label class="group cursor-pointer">
<input class="hidden peer" name="technique" type="radio"/>
<div class="p-4 rounded-xl bg-surface-container-low border border-transparent peer-checked:border-primary/30 peer-checked:bg-primary/5 transition-all group-hover:bg-surface-container-high">
<div class="flex items-center justify-between">
<div>
<span class="block font-semibold text-on-surface">4-7-8</span>
<span class="text-xs text-on-surface-variant">Rahatlatıcı Uyku</span>
</div>
<div class="w-4 h-4 rounded-full border-2 border-outline-variant peer-checked:group-[]:border-primary peer-checked:group-[]:bg-primary flex items-center justify-center">
<div class="w-1.5 h-1.5 rounded-full bg-surface hidden peer-checked:group-[]:block"></div>
</div>
</div>
</div>
</label>
</div>
</div>
<!-- Duration Selection -->
<div class="space-y-3">
<label class="text-sm font-medium text-on-surface-variant px-1">Varsayılan Süre</label>
<div class="bg-surface-container-high rounded-2xl p-2 flex flex-col gap-1">
<button class="w-full text-left px-4 py-3 rounded-xl bg-primary/10 text-primary font-medium flex justify-between items-center transition-all">
                                    3 Dakika
                                    <span class="material-symbols-outlined text-sm">check</span>
</button>
<button class="w-full text-left px-4 py-3 rounded-xl text-on-surface-variant hover:bg-white/5 hover:text-on-surface transition-all">
                                    5 Dakika
                                </button>
<button class="w-full text-left px-4 py-3 rounded-xl text-on-surface-variant hover:bg-white/5 hover:text-on-surface transition-all">
                                    10 Dakika
                                </button>
</div>
</div>
</div>
</section>
<!-- Visual Assets -->
<div class="grid grid-cols-3 gap-4 h-24">
<div class="rounded-2xl overflow-hidden opacity-40 hover:opacity-100 transition-opacity">
<img class="w-full h-full object-cover" data-alt="Deep blue night sky with soft constellations and ethereal nebula wisps in calm dark atmosphere" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAz2g2QRFsTUhBswem-QOF0mKEB7IeBBubjnJILpekZ3asf0GB6zNpBqVx8WsH8i5xg4RMSxnVV2RjyhSYqSu_nIGt-5RR6WUxeaob56ayrIIJ-4-8HMkYxctpZyXZOwXZ-qTey5e8LC6RkmVqplKuJr8YDE-4jEiqhf9keChu-PMGOvvb-ehoz91_htTQLL20rnRR1UtPy8HoA7ccWug3bzL3TAvmoPukh69i1nzEcoIwfh5JSwInnmwXOtgzLdUP_71plQvASu9A"/>
</div>
<div class="rounded-2xl overflow-hidden opacity-40 hover:opacity-100 transition-opacity">
<img class="w-full h-full object-cover" data-alt="Abstract smooth flowing silk texture in deep indigo and lavender tones with soft cinematic lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAr_a-ttnc39LH9RxD9OwMxzS5xWg0pAUWM5nJ9FOn6rou6VZhCdaojHMV8L4WLM1zsHLJc_5y6qlnA1zNWAn4Z52xJ7RvEy7hL75BkK_Td8u_yPv6Uo34RiSqBE2_4U72hwDANFpuc60cQTCnUKxwTSaf5vQ1ReZIofBOZ3NO6l0X2QZV7OLdNhD_i3LmrBFheWyZ7VfgjdXuOIEDKa871iMyDTUfmYXunuUbw6lSce36jupq6zeV-7Q1w50VdsJb8VuB_QwU8Yfw"/>

<div class="rounded-2xl overflow-hidden opacity-40 hover:opacity-100 transition-opacity">
<img class="w-full h-full object-cover" data-alt="Blurred silhouette of person meditating in front of calm misty lake at dawn with cool blue tones" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAlWEH4w1p_D3K60hSKPFAfbDkF10PpOuizDHZj7CKLs4E4QKOO6moROsS5VXF13PZOiWW9EqZt-Ek-hi87Se7eU99zAh9-KAjuWuT6U49-uRqH0NLdt2ownz6P5a6XXSk7DTki8T2ZspROeMk-oU7oNprpSxaXRH1y2Fw_Pf9PftA6sRbUHafue4sxzR213NwPI4mNBfJ88jGn2PVn0W1IG8HJ3FWA0-SliVWD8Y-wyYBmh5ZjilQAc2JJl3JUwDcuRtfDj35YCHw"/>
</div>
</div>
<!-- Footer Actions -->
<footer class="pt-6 flex items-center justify-end gap-4">
<button class="px-8 py-3 rounded-full font-medium text-on-surface-variant hover:text-on-surface hover:bg-white/5 transition-all duration-300">
                        Vazgeç
                    </button>
<button class="px-10 py-3 rounded-full font-headline font-bold text-on-primary bg-gradient-to-br from-primary to-primary-container shadow-lg shadow-primary/20 hover:scale-[1.02] transition-all duration-300">
                        Kaydet
                    </button>
</footer>
</div>
</div>
<!-- Semantic Branding Anchor -->
<div class="mt-8 text-center">
<p class="font-headline font-bold tracking-[0.2em] text-indigo-200/40 text-sm uppercase">Nefes Digital Ether</p>
</div>
</main>
</body></html>
